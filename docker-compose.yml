version: "3.9"

services:

  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: docapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Queue ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docapi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/docapi
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGIN: https://doc-intelligence-api.cyrus-thindwa.me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - default
      - dokploy-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── React Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: docapi_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.docapi-web.entrypoints=web"
      - "traefik.http.routers.docapi-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.docapi-web.rule=Host(`doc-intelligence-api.cyrus-thindwa.me`)"
      - "traefik.http.routers.docapi-web.service=docapi-web"
      - "traefik.http.routers.docapi-websecure.entrypoints=websecure"
      - "traefik.http.routers.docapi-websecure.rule=Host(`doc-intelligence-api.cyrus-thindwa.me`)"
      - "traefik.http.routers.docapi-websecure.service=docapi-websecure"
      - "traefik.http.routers.docapi-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.docapi-web.loadbalancer.server.port=80"
      - "traefik.http.services.docapi-websecure.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data: